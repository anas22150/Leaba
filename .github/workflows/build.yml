
name: Build and Deploy THE LAST SURVIVOR

on:
  push:
    branches:
      - main
    paths:
      - 'THE-LAST-SURVIVOR-READY-TO-PUBLISH.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p site
          unzip -o THE-LAST-SURVIVOR-READY-TO-PUBLISH.zip -d site

      - name: Install Three.js
        run: |
          mkdir -p .threejs
          cd .threejs
          npm init -y
          npm install three@0.128.0
          cp node_modules/three/build/three.min.js ../site/three.min.js

      - name: Verify website files
        run: |
          test -f site/index.html
          test -f site/three.min.js
          echo "Website files verified successfully"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
