name: Build and Deploy THE LAST SURVIVOR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -e
          ZIP_FILE="THE-LAST-SURVIVOR-READY-TO-PUBLISH.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Missing $ZIP_FILE. Upload the game ZIP to the repository root."
            exit 1
          fi
          mkdir -p site
          unzip -q "$ZIP_FILE" -d site
          test -f site/index.html
          echo "Website files prepared:"
          find site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
