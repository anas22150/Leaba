name: Build and Deploy THE LAST SURVIVOR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game ZIP
        run: |
          set -euo pipefail
          ZIP_FILE="THE-LAST-SURVIVOR-READY-TO-PUBLISH.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::لم يتم العثور على $ZIP_FILE في جذر المستودع."
            echo "محتويات المستودع:"
            ls -la
            exit 1
          fi

          mkdir -p site
          unzip -q "$ZIP_FILE" -d site

          if [ ! -s "site/index.html" ]; then
            echo "::error::ملف site/index.html غير موجود أو فارغ."
            find site -maxdepth 3 -type f -print
            exit 1
          fi

          echo "تم تجهيز الموقع:"
          find site -maxdepth 3 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        
