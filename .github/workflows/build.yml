name: Build and Deploy THE LAST SURVIVOR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game ZIP
        run: |
          set -e
          ZIP_FILE="THE-LAST-SURVIVOR-READY-TO-PUBLISH.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::لم يتم العثور على $ZIP_FILE في جذر المستودع."
            echo "الملفات الموجودة:"
            ls -la
            exit 1
          fi

          mkdir -p site
          unzip -q "$ZIP_FILE" -d site

          if [ ! -f "site/index.html" ]; then
            echo "::error::لم يتم العثور على index.html بعد فك الضغط."
            echo "محتويات مجلد site:"
            find site -maxdepth 3 -type f -print
            exit 1
          fi

          echo "تم تجهيز ملفات الموقع:"
          find site -maxdepth 3 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site
          retention-days: 1

      - name: Verify uploaded artifact step
        run: echo "تم تنفيذ خطوة رفع artifact باسم github-pages."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          
